name: 自动递增计数器

on:
  push:
    branches: [ '*' ]

jobs:
  increment:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 读取当前计数
      id: read_count
      run: |
        CURRENT_COUNT=$(cat 9.txt)
        echo "当前计数: $CURRENT_COUNT"
        NEW_COUNT=$((CURRENT_COUNT + 1))
        echo "新计数: $NEW_COUNT"
        echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
        
    - name: 更新计数文件
      run: |
        echo "${{ steps.read_count.outputs.new_count }}" > 9.txt
        
    - name: 提交更改
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add 9.txt
        git diff --staged --quiet || git commit -m "自动递增计数器: ${{ steps.read_count.outputs.new_count }}"
        
    - name: 推送更改
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
