name: Increment 9.txt on push

on:
  push:
    branches:
      - main  # 只监听 main 分支

jobs:
  increment-file:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ 拉取仓库
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # 允许后续 git push 使用 GITHUB_TOKEN

      # 2️⃣ 读取文件并累加
      - name: Increment 9.txt
        run: |
          FILE=9.txt
          if [ ! -f "$FILE" ]; then
            echo "0" > "$FILE"
          fi
          VALUE=$(cat "$FILE")
          VALUE=$((VALUE + 1))
          echo "$VALUE" > "$FILE"
          echo "New value: $VALUE"

      # 3️⃣ 检查是否有更改再提交，避免无限循环
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 9.txt
          # 如果有更改才 commit
          if ! git diff --cached --quiet; then
            git commit -m "Increment 9.txt via Action [skip ci]"
          else
            echo "No changes to commit"
          fi

      # 4️⃣ Push 回仓库
      - name: Push changes
        run: git push origin main