name: Test Upload Workflow

on:
  push:      # 当 push 代码时触发
    branches:
      - '*'  # 所有分支都触发
  pull_request: # PR 也触发

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show branch info
        run: echo "This push was on branch: ${{ github.ref }}"

      - name: List files
        run: ls -l